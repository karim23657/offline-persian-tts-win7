name: build

# Two jobs on purpose:
#   build-and-test  compiles everything and runs the shim self-test under Wine
#                   configured as Windows 7.  This is the gate.
#   package         produces the release archives from a clean tree.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Set at workflow level so every step agrees on the prefix: an `export` in one
# step does not survive into the next.  It lives under $HOME because GitHub
# runners have /tmp at mode 1777 and Wine refuses a prefix it does not own.
env:
  WINEPREFIX: /home/runner/wp7
  WINEDEBUG: -all

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # `wine` (not just `wine64`) is required: it is the package that ships
          # wineboot/winecfg, which the Win7 prefix step below calls.  With only
          # wine64 installed the job died at "wineboot: command not found".
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 wine wine64 xvfb x11-utils zip

      - name: Check dependencies
        run: make deps

      # Wine exports the very Windows 8+ APIs the shim replaces, so a plain
      # Wine run would never execute the fallbacks.  The self-test works around
      # that by resolving each fallback by name through the
      # win7shim_get_fallback hook.  See win7.md.
      - name: Create a Windows 7 Wine prefix
        run: |
          printf '#!/bin/sh\nexec /usr/lib/wine/wine64 "$@"\n' | sudo tee /usr/local/bin/wine >/dev/null
          sudo chmod +x /usr/local/bin/wine
          # WINEPREFIX/WINEDEBUG come from the workflow-level env so the later
          # make test and smoke-test steps use this exact same prefix.
          wineboot -i
          wine reg add 'HKCU\Software\Wine' /v Version /d win7 /f
          wine reg add 'HKLM\Software\Microsoft\Windows NT\CurrentVersion' \
              /v CurrentVersion /d '6.1' /f
          wine cmd /c ver

      - name: Build
        run: make

      # The model is deliberately not committed (79 MB, and it has its own
      # licence), but both 'make test' and the Persian audio step below refuse
      # to pass without one.  scripts\get_model.cmd is a .cmd and cannot run on
      # Linux, so fetch the same tarball it would and unpack it here.
      - name: Fetch the Persian model
        run: |
          set -euo pipefail
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-gyro-medium.tar.bz2"
          curl -L --fail --silent --show-error -o /tmp/gyro.tar.bz2 "$url"
          mkdir -p models
          tar -xjf /tmp/gyro.tar.bz2 -C models
          test -d models/vits-piper-fa_IR-gyro-medium

      - name: Shim self-test
        run: make test

      - name: Smoke test - synthesise Persian audio
        run: |
          set -e
          # A longer phrase on purpose: the point is to catch truncated or
          # silent output, and a two-word sentence legitimately lasts well
          # under a second (سلام دنیا measures ~0.8 s), which tripped a >1 s
          # assertion on a perfectly good build.
          python3 - <<'PY'
          text = 'سلام دنیا. این یک آزمایش است برای اطمینان از کارکرد درست موتور تبدیل متن به گفتار.'
          open('smoke.txt', 'w', encoding='utf-8').write(text)
          PY
          wine runtime/say.exe --model models/vits-piper-fa_IR-gyro-medium \
              --out smoke.wav --text-file smoke.txt
          python3 - <<'PY'
          import wave
          w = wave.open('smoke.wav')
          dur = w.getnframes() / float(w.getframerate())
          # Avoid audioop: it is deprecated in 3.11 and removed in 3.13, and
          # the runner's python version can move under us.
          frames = w.readframes(w.getnframes())
          width = w.getsampwidth()
          peak = max(abs(int.from_bytes(frames[i:i+width], 'little', signed=True))
                     for i in range(0, len(frames) - width + 1, width))
          assert w.getframerate() == 22050, w.getframerate()
          assert dur > 1.0, 'suspiciously short audio: %r' % dur
          # Silence would still be "long enough", so check it actually has sound.
          assert peak > 1000, 'output is silent (peak %d)' % peak
          print('OK: %.2f s at %d Hz, peak %d' % (dur, w.getframerate(), peak))
          PY

      - name: Verify no Windows 8+ DLL imports remain
        run: |
          fail=0
          for f in runtime/*.dll runtime/*.exe; do
            if objdump -p "$f" | grep -q 'DLL Name: dxgi.dll'; then
              echo "::error::$f still imports dxgi.dll"; fail=1
            fi
            if objdump -p "$f" | grep -q 'DLL Name: api-ms-win-core-path-l1-1-0.dll'; then
              echo "::error::$f still imports api-ms-win-core-path-l1-1-0.dll"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "all imports redirected"
          exit $fail

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 zip
      # The model is not committed (79 MB), so the "with model" archive is
      # produced by a separate manual run that has it available; CI builds the
      # slim archive and uploads it automatically.
      - name: Build slim archive
        run: |
          python3 scripts/make_slim_zip.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: win7-tts-runtime-only
          path: dist/win7-tts-runtime-only.zip
